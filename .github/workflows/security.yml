name: Security & Vulnerability Scan (Defender Bot)

on:
  push:
    branches: [main, staging, qa]
  pull_request:
    branches: [main, staging, qa]
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: Dependency Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: Audit Frontend Dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true

  container-security-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Nginx Container for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: frontend-nginx:scan

      - name: Build Backend Container for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: backend:scan

      - name: Run Trivy Vulnerability Scanner on Frontend (Nginx)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frontend-nginx:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
