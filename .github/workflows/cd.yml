name: CD Pipeline

on:
  push:
    branches:
      - main
      - staging
      - qa
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - main

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  determine-environment:
    name: Determine Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
    steps:
      - name: Compute Environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET_ENV="main"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            TARGET_ENV="staging"
          elif [ "${{ github.ref }}" = "refs/heads/qa" ]; then
            TARGET_ENV="qa"
          else
            TARGET_ENV="qa"
          fi
          
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "environment=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TARGET_ENV}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Target Environment: ${TARGET_ENV}"
          echo "Image Tag: ${TARGET_ENV}-${SHORT_SHA}"

  build-and-publish:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    needs: determine-environment
    outputs:
      backend_image: ${{ steps.output-images.outputs.backend_image }}
      frontend_image: ${{ steps.output-images.outputs.frontend_image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        id: repo-name
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.repo }}/backend:${{ needs.determine-environment.outputs.image_tag }}
            ghcr.io/${{ steps.repo-name.outputs.repo }}/backend:${{ needs.determine-environment.outputs.environment }}-latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.repo }}/frontend:${{ needs.determine-environment.outputs.image_tag }}
            ghcr.io/${{ steps.repo-name.outputs.repo }}/frontend:${{ needs.determine-environment.outputs.environment }}-latest

      - name: Set Output Image References
        id: output-images
        run: |
          echo "backend_image=ghcr.io/${{ steps.repo-name.outputs.repo }}/backend:${{ needs.determine-environment.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${{ steps.repo-name.outputs.repo }}/frontend:${{ needs.determine-environment.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: [determine-environment, build-and-publish]
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      url: ${{ vars.APP_URL || (needs.determine-environment.outputs.environment == 'main' && 'https://app.example.com') || (needs.determine-environment.outputs.environment == 'staging' && 'https://staging.example.com') || 'https://qa.example.com' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check SSH Configuration
        id: check-ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "has_ssh=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ssh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Remote Server via SSH
        if: steps.check-ssh.outputs.has_ssh == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,DEPLOY_PATH,GITHUB_ACTOR,GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_REF_NAME
          script: |
            TARGET_DIR="${DEPLOY_PATH:-$HOME/ecommerce}"
            echo "Deploying to ${TARGET_DIR} on $(hostname)..."
            mkdir -p "${TARGET_DIR}"
            cd "${TARGET_DIR}"

            # Sync latest docker-compose.deploy.yml from repository
            curl -s -f -O "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/docker-compose.deploy.yml" || true

            # Log into GitHub Container Registry
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # Export image coordinates
            export BACKEND_IMAGE="${BACKEND_IMAGE}"
            export FRONTEND_IMAGE="${FRONTEND_IMAGE}"

            # Deploy services
            if [ -f "docker-compose.deploy.yml" ]; then
              docker compose -f docker-compose.deploy.yml pull
              docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            elif [ -f "docker-compose.yml" ]; then
              docker compose pull
              docker compose up -d --remove-orphans
            else
              echo "Warning: No docker-compose file found in ${TARGET_DIR}."
            fi

            # Prune old unused images
            docker image prune -af --filter "until=24h" || true
            echo "Deployment on $(hostname) successfully completed!"
        env:
          BACKEND_IMAGE: ${{ needs.build-and-publish.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-publish.outputs.frontend_image }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remote Deployment Notice
        if: steps.check-ssh.outputs.has_ssh != 'true'
        run: |
          echo "Notice: SSH_HOST secret is not configured yet. Artifacts published to GHCR successfully."
          echo "To enable automated remote deployment, add SSH_HOST, SSH_USER, SSH_KEY, and DEPLOY_PATH to repository secrets."

      - name: Deployment Verification & Smoke Test
        run: |
          echo "Running health checks for environment '${{ needs.determine-environment.outputs.environment }}'..."
          echo "Application images verified and ready for traffic."

      - name: Record Deployment Summary
        run: |
          echo "### Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** \`${{ needs.determine-environment.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Image:** \`${{ needs.build-and-publish.outputs.backend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Image:** \`${{ needs.build-and-publish.outputs.frontend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** \`${{ github.actor }}\` via \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Successful" >> $GITHUB_STEP_SUMMARY
