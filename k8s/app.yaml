# ============================================================
# 1. NAMESPACE
# ============================================================

apiVersion: v1                         # Kubernetes API version for Namespace
kind: Namespace                        # We are creating a Namespace
metadata:                              # Metadata about this resource
  name: sineth-test-ecommerce          # Name of the Namespace


# ============================================================
# 2. MONGODB SERVICE
# ============================================================

---

apiVersion: v1                         # Kubernetes API version for Service
kind: Service                          # We are creating a Service
metadata:                              # Information about the Service
  name: mongodb                        # Service name = mongodb
  namespace: sineth-test-ecommerce     # Put this Service inside our Namespace
spec:                                  # Configuration/specification of the Service
  selector:                            # Select which Pods receive traffic
    app: mongodb                       # Select Pods with label app=mongodb
  ports:                               # Define the network ports
    - name: mongodb                    # Name of this port
      port: 27017                      # Port exposed by the Service
      targetPort: 27017                # Port on the MongoDB Pod/container


# ============================================================
# 3. BACKEND SERVICE
# ============================================================

---

apiVersion: v1                         # Kubernetes API version for Service
kind: Service                          # We are creating a Service
metadata:                              # Information about the Service
  name: backend                        # Service name = backend
  namespace: sineth-test-ecommerce     # Put this Service inside our Namespace
spec:                                  # Service configuration
  selector:                            # Select which Pods receive traffic
    app: backend                       # Select Pods with label app=backend
  ports:                               # Define the network ports
    - name: http                       # Name of this port
      port: 5000                       # Port exposed by the Service
      targetPort: 5000                 # Port on the backend Pod/container


# ============================================================
# 4. FRONTEND SERVICE
# ============================================================

---

apiVersion: v1                         # Kubernetes API version for Service
kind: Service                          # We are creating a Service
metadata:                              # Information about the Service
  name: frontend                       # Service name = frontend
  namespace: sineth-test-ecommerce     # Put this Service inside our Namespace
spec:                                  # Service configuration
  type: NodePort                       # Expose the frontend outside the cluster
  selector:                            # Select which Pods receive traffic
    app: frontend                      # Select Pods with label app=frontend
  ports:                               # Define the network ports
    - name: http                       # Name of this port
      port: 80                         # Service port
      targetPort: 80                   # Port on the frontend container
      nodePort: 30081                  # External port used to access the application


# ============================================================
# 5. PERSISTENT VOLUME CLAIM FOR MONGODB
# ============================================================

---

apiVersion: v1                         # Kubernetes API version for PVC
kind: PersistentVolumeClaim             # Request persistent storage
metadata:                              # Information about the PVC
  name: mongodb-data                   # PVC name
  namespace: sineth-test-ecommerce     # Put PVC inside our Namespace
spec:                                  # PVC configuration
  accessModes:                         # Define how the storage can be accessed
    - ReadWriteOnce                    # Read/write access from one node
  resources:                           # Storage resources requested
    requests:                          # Amount of storage requested
      storage: 0.5Gi                     # Request 5 GB of persistent storage


# ============================================================
# 6. MONGODB DEPLOYMENT
# ============================================================

---

apiVersion: apps/v1                    # API version used for Deployments
kind: Deployment                       # We are creating a Deployment
metadata:                              # Deployment information
  name: mongodb                        # Deployment name = mongodb
  namespace: sineth-test-ecommerce     # Put Deployment inside our Namespace
spec:                                  # Deployment configuration
  replicas: 1                          # Kubernetes should maintain 1 MongoDB Pod

  strategy:                            # Define how Pods are replaced during updates
    type: Recreate                     # Stop old Pod before creating new Pod

  selector:                            # Tell Deployment which Pods it manages
    matchLabels:                       # Match Pods using labels
      app: mongodb                     # Manage Pods with app=mongodb

  template:                            # Template used to create MongoDB Pods
    metadata:                           # Metadata for the Pod
      labels:                          # Labels attached to the Pod
        app: mongodb                   # Pod label = app=mongodb

    spec:                              # Pod configuration
      containers:                      # List of containers inside the Pod

        - name: mongodb                # Container name
          image: mongo:7                # Use MongoDB version 7 Docker image

          ports:                       # Ports used by the container
            - containerPort: 27017     # MongoDB listens on port 27017

          resources:                   # CPU and memory configuration
            requests:                 # Minimum resources requested
              cpu: 100m                # Request 0.1 CPU core
              memory: 256Mi            # Request 256 MiB RAM
            limits:                    # Maximum resources allowed
              cpu: 500m                # Maximum 0.5 CPU core
              memory: 512Mi            # Maximum 512 MiB RAM

          volumeMounts:                # Mount persistent storage into container
            - name: mongodb-data       # Use volume named mongodb-data
              mountPath: /data/db      # Mount storage where MongoDB stores data

          readinessProbe:              # Check whether MongoDB is ready
            tcpSocket:                 # Test using a TCP connection
              port: 27017              # Check MongoDB port
            initialDelaySeconds: 5     # Wait 5 seconds before first check
            periodSeconds: 10          # Check every 10 seconds

          livenessProbe:               # Check whether MongoDB is still alive
            tcpSocket:                 # Test using a TCP connection
              port: 27017              # Check MongoDB port
            initialDelaySeconds: 30    # Wait 30 seconds before first check
            periodSeconds: 20          # Check every 20 seconds

      volumes:                         # Define volumes available to the Pod
        - name: mongodb-data           # Volume name
          persistentVolumeClaim:       # Get storage from a PVC
            claimName: mongodb-data    # Use the mongodb-data PVC


# ============================================================
# 7. BACKEND DEPLOYMENT
# ============================================================

---

apiVersion: apps/v1                    # API version used for Deployments
kind: Deployment                       # We are creating a Deployment
metadata:                              # Deployment information
  name: backend                        # Deployment name = backend
  namespace: sineth-test-ecommerce     # Put Deployment inside our Namespace
spec:                                  # Deployment configuration
  replicas: 1                          # Kubernetes should maintain 1 backend Pod

  selector:                            # Tell Deployment which Pods it manages
    matchLabels:                       # Match Pods using labels
      app: backend                     # Manage Pods with app=backend

  template:                            # Template used to create backend Pods
    metadata:                           # Metadata for the Pod
      labels:                          # Labels attached to the Pod
        app: backend                   # Pod label = app=backend

    spec:                              # Pod configuration

      imagePullSecrets:                # Credentials used to pull private images
        - name: ghcr-pull-secret       # Secret containing GHCR credentials

      containers:                      # List of containers in the Pod
        - name: backend                # Container name
          image: ${BACKEND_IMAGE}      # Backend Docker image; replaced by CI/CD
          imagePullPolicy: Always      # Always check registry for the latest image

          ports:                       # Container ports
            - containerPort: 5000      # Backend application listens on port 5000

          resources:                   # CPU and memory configuration
            requests:                 # Minimum resources requested
              cpu: 100m                # Request 0.1 CPU core
              memory: 128Mi            # Request 128 MiB RAM
            limits:                    # Maximum resources allowed
              cpu: 500m                # Maximum 0.5 CPU core
              memory: 512Mi            # Maximum 512 MiB RAM

          env:                         # Environment variables for backend
            - name: PORT               # Environment variable name
              value: "5000"            # Backend listens on port 5000

            - name: NODE_ENV           # Node.js environment variable
              value: production        # Run application in production mode

            - name: CLIENT_URL         # Frontend/client URL
              value: "*"               # Allow requests from any origin

            - name: MONGO_URI          # MongoDB connection string variable
              valueFrom:                # Get the value from another Kubernetes resource
                secretKeyRef:           # Read the value from a Kubernetes Secret
                  name: ecommerce-secrets # Secret name
                  key: MONGO_URI       # Key inside the Secret

          readinessProbe:              # Check whether backend is ready
            httpGet:                   # Send an HTTP request
              path: /api/health        # Health-check endpoint
              port: 5000               # Backend port
            initialDelaySeconds: 10    # Wait 10 seconds before checking
            periodSeconds: 10          # Check every 10 seconds

          livenessProbe:               # Check whether backend is still alive
            httpGet:                   # Send an HTTP request
              path: /api/health        # Health-check endpoint
              port: 5000               # Backend port
            initialDelaySeconds: 30    # Wait 30 seconds before checking
            periodSeconds: 20          # Check every 20 seconds


# ============================================================
# 8. FRONTEND DEPLOYMENT
# ============================================================

---

apiVersion: apps/v1                    # API version used for Deployments
kind: Deployment                       # We are creating a Deployment
metadata:                              # Deployment information
  name: frontend                       # Deployment name = frontend
  namespace: sineth-test-ecommerce     # Put Deployment inside our Namespace
spec:                                  # Deployment configuration
  replicas: 1                          # Kubernetes should maintain 1 frontend Pod

  selector:                            # Tell Deployment which Pods it manages
    matchLabels:                       # Match Pods using labels
      app: frontend                    # Manage Pods with app=frontend

  template:                            # Template used to create frontend Pods
    metadata:                           # Metadata for the Pod
      labels:                          # Labels attached to the Pod
        app: frontend                  # Pod label = app=frontend

    spec:                              # Pod configuration

      imagePullSecrets:                # Credentials used to pull private image
        - name: ghcr-pull-secret       # Secret containing GHCR credentials

      containers:                      # List of containers in the Pod
        - name: frontend               # Container name
          image: ${FRONTEND_IMAGE}     # Frontend Docker image; replaced by CI/CD
          imagePullPolicy: Always      # Always check registry for the image

          ports:                       # Container ports
            - containerPort: 80        # Frontend/Nginx listens on port 80

          resources:                   # CPU and memory configuration
            requests:                 # Minimum resources requested
              cpu: 50m                 # Request 0.05 CPU core
              memory: 64Mi             # Request 64 MiB RAM
            limits:                    # Maximum resources allowed
              cpu: 250m                # Maximum 0.25 CPU core
              memory: 256Mi            # Maximum 256 MiB RAM

          readinessProbe:              # Check whether frontend is ready
            httpGet:                   # Send an HTTP request
              path: /                 # Check the frontend root URL
              port: 80                # Frontend port
            initialDelaySeconds: 5     # Wait 5 seconds before first check
            periodSeconds: 10          # Check every 10 seconds

          livenessProbe:               # Check whether frontend is still alive
            httpGet:                   # Send an HTTP request
              path: /                 # Check the frontend root URL
              port: 80                # Frontend port
            initialDelaySeconds: 20    # Wait 20 seconds before first check
            periodSeconds: 20          # Check every 20 seconds
